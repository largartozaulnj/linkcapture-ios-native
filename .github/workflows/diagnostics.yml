name: Export simulator test evidence
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Build run ID whose evidence should be exported
        required: true
        default: "39082541720"
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Inspect existing XCTest evidence without repeating navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package report
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BUILD_RUN" -n LinkCapture-experimental-and-test-results -D package
          xcrun xcresulttool get test-results summary --path package/NetworkTests.xcresult > report/network-test-summary.json
          xcrun xcresulttool export diagnostics --path package/NetworkTests.xcresult --output-path package/diagnostics
          xcrun xcresulttool get test-results summary --path package/UnitTests.xcresult > report/unit-test-summary.json
          xcrun xcresulttool export attachments --path package/NetworkTests.xcresult --output-path package/attachments
          xcrun xcresulttool export attachments --path package/UnitTests.xcresult --output-path package/layout-attachments
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports=[]
          for file in Path('package/diagnostics').rglob('*'):
              if file.suffix not in ('.ips','.crash'):
                  continue
              text=file.read_text(errors='replace')
              if file.suffix=='.ips':
                  try:
                      data=json.loads(text.split('\n',1)[1])
                      if data.get('procName') != 'LinkCapture': continue
                      thread=data.get('faultingThread',0)
                      frames=data.get('threads',[{}])[thread].get('frames',[])
                      reports.append({'name':file.name,'process':data.get('procName'),'exception':data.get('exception'),'termination':data.get('termination'),
                                      'images':[{k:i.get(k) for k in ('name','base','size','uuid')} for i in data.get('usedImages',[])], 'frames':[{k:f[k] for k in ('symbol','symbolLocation','imageIndex','imageOffset') if k in f} for f in frames[:30]]})
                  except (ValueError,IndexError):
                      pass
              else:
                  lines=text.splitlines()
                  reports.append({'name':file.name,'details':[line for line in lines if any(x in line for x in ('Exception Type:','Termination Reason:','Triggered by Thread:','LinkCapture','assert','dispatch_assert'))][:45]})
          Path('report/network-test-crashes.json').write_text(json.dumps(reports,indent=2))
          print(json.dumps(reports,indent=2))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          observations=[]
          for file in Path('package/attachments').rglob('*'):
              if not file.is_file() or file.suffix != '.json': continue
              try:
                  obj=json.loads(file.read_text())
                  if isinstance(obj,dict) and 'url' in obj and 'graphics' in obj and 'redirects' in obj:
                      observations.append(obj)
              except (ValueError,UnicodeError): pass
          Path('report/network-observations.json').write_text(json.dumps(observations,indent=2))
          print(json.dumps(observations,indent=2))
          PY
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          images=[]
          for file in sorted(Path('package/layout-attachments').rglob('*')):
              if file.suffix.lower() not in ('.png','.jpg','.jpeg'): continue
              name=f'layout-{len(images)+1}{file.suffix.lower()}'
              shutil.copyfile(file,Path('report')/name)
              images.append({'asset':name,'attachmentFile':file.name})
          Path('report/layout-index.json').write_text(json.dumps(images,indent=2))
          print(json.dumps(images,indent=2))
          PY
          gh release upload "experimental-run-$BUILD_RUN" report/* --clobber


